name: Build & Release

# 改为仅手动触发或推送 v* 标签时执行打包，杜绝普通 push 频繁触发失败
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "是否同时发布为 GitHub Release"
        required: false
        type: boolean
        default: false
      custom_tag:
        description: "发布 Release 时的版本号（若留空则自动生成时间戳版本，如 v0.1.0-20261121）"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod
  GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
  WORKER_REPOSITORY: ehZyiL/zju-connect
  # 固定 worker 版本：优先用仓库变量 WORKER_REF（建议填一个 commit SHA），
  # 缺省回退分支——分支会移动，开发包可以，发布包请把 WORKER_REF 钉到 SHA。
  WORKER_REF: ${{ vars.WORKER_REF || 'feat/desktop-worker' }}

jobs:
  build-windows:
    name: 构建 Windows 便携包 (amd64)
    runs-on: windows-latest
    steps:
      - name: 检出 Connect Hub (主仓库)
        uses: actions/checkout@v4
        with:
          path: connect-hub

      - name: 检出 ZJU-Connect (依赖 Worker 分支)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WORKER_REPOSITORY }}
          ref: ${{ env.WORKER_REF }}
          token: ${{ secrets.GH_PAT || github.token }}
          path: zju-connect

      - name: 配置 Go 运行环境
        uses: actions/setup-go@v5
        with:
          go-version-file: connect-hub/go.mod
          cache: true
          cache-dependency-path: |
            connect-hub/go.sum
            zju-connect/go.sum

      - name: 校验 worker IPC 协议与 worker 源码一致
        shell: bash
        run: |
          cd connect-hub
          go run ./internal/workeripc/cmd/protogen -check -src ../zju-connect/internal/desktop/protocol.go -out ./internal/workeripc/protocol.go

      - name: 校验代码格式（gofmt）
        shell: bash
        run: |
          set -euo pipefail
          cd connect-hub
          # third_party/ 是上游代码，按上游格式保留，不参与本仓库的格式约束。
          # 用 git 的文件清单做过滤（git 输出的路径始终是正斜杠），而不是过滤
          # gofmt -l 的输出——Windows 上 gofmt 会输出反斜杠路径，导致过滤失效。
          files=()
          while IFS= read -r f; do
            if [[ $f == third_party/* ]]; then
              continue
            fi
            files+=("$f")
          done < <(git ls-files -- '*.go')
          unformatted=""
          if (( ${#files[@]} > 0 )); then
            unformatted=$(gofmt -l "${files[@]}" || true)
          fi
          if [[ -n "$unformatted" ]]; then
            printf 'These files need gofmt -w:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: 执行 Windows 便携包打包构建
        shell: bash
        env:
          ZJU_CONNECT_ROOT: ${{ github.workspace }}/zju-connect
        run: |
          cd connect-hub
          bash ./scripts/package-windows.sh

      - name: 安装 NSIS 打包工具
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: 生成 Windows 安装包 (Setup.exe)
        shell: bash
        run: |
          cd connect-hub
          go run ./cmd/appicon -ico resources/icon.ico
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          makensis packaging/windows/installer.nsi

      - name: 上传 Windows 产物 (便携包与安装程序)
        uses: actions/upload-artifact@v4
        with:
          name: connect-hub-windows-amd64
          path: |
            connect-hub/build/connect-hub-windows-*.zip
            connect-hub/build/connect-hub-setup-windows-*.exe
          if-no-files-found: error

  build-linux:
    name: 构建 Linux 便携包 (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: 检出 Connect Hub (主仓库)
        uses: actions/checkout@v4
        with:
          path: connect-hub

      - name: 检出 ZJU-Connect (依赖 Worker 分支)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WORKER_REPOSITORY }}
          ref: ${{ env.WORKER_REF }}
          token: ${{ secrets.GH_PAT || github.token }}
          path: zju-connect

      - name: 配置 Go 运行环境
        uses: actions/setup-go@v5
        with:
          go-version-file: connect-hub/go.mod
          cache: true
          cache-dependency-path: |
            connect-hub/go.sum
            zju-connect/go.sum

      - name: 校验 worker IPC 协议与 worker 源码一致
        shell: bash
        run: |
          cd connect-hub
          go run ./internal/workeripc/cmd/protogen -check -src ../zju-connect/internal/desktop/protocol.go -out ./internal/workeripc/protocol.go

      - name: 校验代码格式（gofmt）
        shell: bash
        run: |
          set -euo pipefail
          cd connect-hub
          # third_party/ 是上游代码，按上游格式保留，不参与本仓库的格式约束。
          # 用 git 的文件清单做过滤（git 输出的路径始终是正斜杠），而不是过滤
          # gofmt -l 的输出——Windows 上 gofmt 会输出反斜杠路径，导致过滤失效。
          files=()
          while IFS= read -r f; do
            if [[ $f == third_party/* ]]; then
              continue
            fi
            files+=("$f")
          done < <(git ls-files -- '*.go')
          unformatted=""
          if (( ${#files[@]} > 0 )); then
            unformatted=$(gofmt -l "${files[@]}" || true)
          fi
          if [[ -n "$unformatted" ]]; then
            printf 'These files need gofmt -w:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: 执行 Linux 打包构建
        env:
          ZJU_CONNECT_ROOT: ${{ github.workspace }}/zju-connect
        run: |
          cd connect-hub
          bash ./scripts/package-linux.sh

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: connect-hub-linux-amd64
          path: connect-hub/build/connect-hub-linux-*.tar.gz
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出已准备产物
        run: ls -lh dist/

      - name: 确定 Release 标签版本
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.custom_tag }}" ]]; then
            echo "tag=${{ inputs.custom_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.1.0-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: 创建并发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Connect Hub ${{ steps.release_tag.outputs.tag }}"
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
